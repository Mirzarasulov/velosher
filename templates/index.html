<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚴 Velosher Shop</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .logo { font-size: 64px; margin-bottom: 10px; }
        h1 { color: #2d3436; font-size: 28px; margin-bottom: 5px; }
        .subtitle { color: #6c757d; font-size: 16px; margin-bottom: 30px; }
        .btn {
            display: block;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            margin: 10px 0;
            transition: all 0.3s;
            text-align: center;
        }
        .btn:hover { transform: scale(1.02); }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover { box-shadow: 0 8px 25px rgba(102,126,234,0.4); }
        .btn-telegram { background: #0088cc; color: white; }
        .btn-telegram:hover { background: #006699; }
        .btn-secondary { background: #2d3436; color: white; }
        .btn-secondary:hover { background: #1a1a2e; }
        .badge { background: #00b894; color: white; padding: 4px 14px; border-radius: 20px; font-size: 12px; display: inline-block; margin-bottom: 15px; }
        .links { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 15px 0; }
        .links a { color: #667eea; text-decoration: none; font-size: 14px; padding: 4px 12px; border: 1px solid #667eea; border-radius: 20px; transition: all 0.3s; }
        .links a:hover { background: #667eea; color: white; }
        .footer { margin-top: 25px; padding-top: 15px; border-top: 1px solid #eee; color: #b2bec3; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🚴</div>
        <h1>Velosher Shop</h1>
        <p class="subtitle">Магазин велосипедов</p>
        
        <div class="badge">🟢 Сайт в разработке</div>

        <a href="https://t.me/velosher_shop_bot" class="btn btn-telegram">
            🤖 Telegram Бот
        </a>
        <a href="/velosher/templates/shop" class="btn btn-primary">
            🛍️ Магазин
        </a>

        <div class="links">
            <a href="/velosher/templates/admin">🔐 Админ-панель</a>
            <a href="https://github.com/Mirzarasulov/velosher">📦 GitHub</a>
        </div>

        <div class="footer">
            <p>© 2024 Velosher Shop</p>
            <p style="font-size: 11px; color: #dfe6e9;">
                Для оформления заказа перейдите в Telegram бот
            </p>
        </div>
    </div>
</body>
</html>
