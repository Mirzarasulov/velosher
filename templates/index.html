<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚴 Velosher Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a1a;
            --card: #1a1a2e;
            --text: #ffffff;
            --text-muted: #a0a0b0;
            --border: #2a2a4e;
            --primary: #667eea;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            background: var(--card);
            border-radius: 24px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            border: 1px solid var(--border);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            text-align: center;
        }
        .logo { font-size: 64px; margin-bottom: 10px; }
        h1 { color: var(--text); font-size: 28px; margin: 10px 0; }
        .subtitle { color: var(--text-muted); font-size: 16px; margin-bottom: 25px; }
        .btn {
            display: block;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            margin: 10px 0;
            transition: all 0.3s;
            text-align: center;
            border: none;
            cursor: pointer;
        }
        .btn:hover { transform: scale(1.02); }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover { box-shadow: 0 8px 25px rgba(102,126,234,0.4); }
        .btn-telegram { background: #0088cc; color: white; }
        .btn-telegram:hover { background: #006699; }
        .btn-secondary { background: #2d3436; color: white; }
        .btn-secondary:hover { background: #1a1a2e; }
        .btn-warning { background: #f39c12; color: #1a1a2e; }
        .btn-warning:hover { background: #d68910; }
        .btn-success { background: #00b894; color: white; }
        .btn-success:hover { background: #00a381; }
        .btn-danger { background: #ff4757; color: white; }
        .btn-danger:hover { background: #ff6b81; }
        .badge { background: #00b894; color: white; padding: 4px 14px; border-radius: 20px; font-size: 12px; display: inline-block; margin-bottom: 15px; }
        .links { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 15px 0; }
        .links a { color: var(--primary); text-decoration: none; font-size: 13px; padding: 6px 14px; border: 1px solid var(--primary); border-radius: 20px; transition: all 0.3s; }
        .links a:hover { background: var(--primary); color: white; }
        .footer { margin-top: 25px; padding-top: 15px; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 12px; }
        .theme-toggle {
            background: var(--border);
            border: none;
            color: var(--text);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            margin-bottom: 15px;
        }
        .theme-toggle:hover { background: var(--primary); }
        @media (max-width: 480px) { .container { padding: 25px; } }
    </style>
</head>
<body>
    <div class="container" id="app">
        <button class="theme-toggle" onclick="toggleTheme()">
            <i class="fas fa-moon" id="themeIcon"></i> <span id="themeText">Темная</span>
        </button>

        <div class="logo">🚴</div>
        <h1>Velosher Shop</h1>
        <p class="subtitle">Магазин велосипедов</p>

        <div class="badge">🟢 Сайт работает</div>

        <a href="shop.html" class="btn btn-primary">
            🛍️ Перейти в магазин
        </a>

        <a href="admin/dashboard.html" class="btn btn-secondary">
            🔐 Админ-панель
        </a>

        <a href="https://t.me/velosher_shop_bot" class="btn btn-telegram">
            🤖 Telegram Бот
        </a>

        <div class="links">
            <a href="admin/users.html">👥 Пользователи</a>
            <a href="admin/orders.html">📦 Заказы</a>
            <a href="admin/products.html">🏷️ Товары</a>
            <a href="admin/chat.html">💬 Чат</a>
            <a href="admin/broadcast.html">📢 Рассылка</a>
        </div>

        <div class="footer">
            <p>© 2024 Velosher Shop</p>
            <p style="font-size: 11px;">Все заказы через Telegram бот</p>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const root = document.documentElement;
            const currentBg = getComputedStyle(root).getPropertyValue('--bg').trim();
            const isDark = currentBg === '#0a0a1a';
            
            if (isDark) {
                root.style.setProperty('--bg', '#f0f2f5');
                root.style.setProperty('--card', '#ffffff');
                root.style.setProperty('--text', '#2d3436');
                root.style.setProperty('--text-muted', '#6c757d');
                root.style.setProperty('--border', '#e0e0e0');
                document.getElementById('themeIcon').className = 'fas fa-sun';
                document.getElementById('themeText').textContent = 'Светлая';
            } else {
                root.style.setProperty('--bg', '#0a0a1a');
                root.style.setProperty('--card', '#1a1a2e');
                root.style.setProperty('--text', '#ffffff');
                root.style.setProperty('--text-muted', '#a0a0b0');
                root.style.setProperty('--border', '#2a2a4e');
                document.getElementById('themeIcon').className = 'fas fa-moon';
                document.getElementById('themeText').textContent = 'Темная';
            }
        }
    </script>
</body>
</html>
