<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚲 Velosher - Магазин</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a1a;
            --card: #1a1a2e;
            --text: #ffffff;
            --text-muted: #a0a0b0;
            --border: #2a2a4e;
            --primary: #667eea;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 15px 0; }
        .navbar .brand { color: white; font-size: 22px; font-weight: 700; text-decoration: none; }
        .navbar .brand i { margin-right: 10px; }
        .btn-back { background: rgba(255,255,255,0.2); color: white; padding: 8px 16px; border-radius: 10px; text-decoration: none; font-size: 14px; }
        .btn-back:hover { background: rgba(255,255,255,0.3); color: white; }
        .cart-btn { background: rgba(255,255,255,0.2); color: white; border: none; padding: 8px 16px; border-radius: 10px; font-size: 14px; }
        .cart-btn:hover { background: rgba(255,255,255,0.3); }
        .cart-count { background: #ff4757; color: white; border-radius: 50%; padding: 2px 8px; font-size: 12px; margin-left: 6px; }
        .product-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; transition: all 0.3s; height: 100%; cursor: pointer; }
        .product-card:hover { transform: translateY(-8px); box-shadow: 0 10px 30px rgba(102,126,234,0.2); }
        .product-image { width: 100%; height: 180px; object-fit: contain; background: rgba(255,255,255,0.03); padding: 15px; }
        .product-body { padding: 15px; }
        .product-name { font-weight: 600; font-size: 16px; color: var(--text); }
        .product-price { font-size: 18px; font-weight: 700; color: var(--primary); }
        .btn-add { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 10px; border-radius: 10px; font-weight: 600; width: 100%; transition: all 0.3s; }
        .btn-add:hover { transform: scale(1.02); }
        .btn-add:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-add.in-cart { background: #00b894; }
        .filter-section { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        .filter-section .form-control, .filter-section .form-select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
        .filter-section .form-control::placeholder { color: var(--text-muted); }
        .filter-section .form-control:focus, .filter-section .form-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(102,126,234,0.2); }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #2d3436; color: white; padding: 14px 24px; border-radius: 12px; z-index: 9999; animation: slideUp 0.4s; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .footer { background: var(--card); border-top: 1px solid var(--border); padding: 30px 0; margin-top: 40px; text-align: center; }
        .footer p { color: var(--text-muted); font-size: 14px; }
        .theme-toggle {
            background: var(--border);
            border: none;
            color: var(--text);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        .theme-toggle:hover { background: var(--primary); }
        .cart-modal { position: fixed; top: 0; right: -400px; width: 380px; max-width: 92%; height: 100%; background: var(--card); z-index: 10000; transition: right 0.4s; box-shadow: -10px 0 40px rgba(0,0,0,0.3); overflow-y: auto; border-left: 1px solid var(--border); }
        .cart-modal.open { right: 0; }
        .cart-modal-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .cart-modal-header .close-btn { background: none; border: none; color: white; font-size: 28px; cursor: pointer; }
        .cart-item { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border); gap: 12px; }
        .cart-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; }
        .cart-item-info { flex: 1; }
        .cart-item-name { font-weight: 600; color: var(--text); font-size: 14px; }
        .cart-item-price { color: var(--primary); font-weight: 600; font-size: 14px; }
        .cart-item-qty { display: flex; align-items: center; gap: 8px; }
        .cart-item-qty button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; font-size: 14px; }
        .cart-item-qty button:hover { background: var(--primary); color: white; }
        .cart-total { padding: 20px; background: var(--bg); border-top: 2px solid var(--primary); position: sticky; bottom: 0; }
        .cart-total .total-price { font-size: 22px; font-weight: 700; color: var(--primary); }
        .btn-checkout { background: linear-gradient(135deg, #00b894 0%, #00a381 100%); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 600; width: 100%; transition: all 0.3s; }
        .btn-checkout:hover { transform: scale(1.02); }
        .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 9999; display: none; }
        .overlay.show { display: block; }
        @media (max-width: 768px) { .product-image { height: 140px; } .cart-modal { width: 100%; max-width: 100%; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <div class="row w-100 align-items-center">
                <div class="col-4">
                    <a href="index.html" class="brand"><i class="fas fa-bicycle"></i> Velosher</a>
                </div>
                <div class="col-8 text-end">
                    <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon" id="themeIcon"></i></button>
                    <a href="index.html" class="btn-back me-2"><i class="fas fa-arrow-left"></i></a>
                    <button class="cart-btn" onclick="toggleCart()">
                        <i class="fas fa-shopping-cart"></i> <span class="cart-count" id="cartCount">0</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="filter-section">
            <div class="row align-items-center">
                <div class="col-md-4"><h5 class="mb-0" style="color:var(--text);"><i class="fas fa-filter" style="color:var(--primary);"></i> Каталог</h5></div>
                <div class="col-md-4 mt-2 mt-md-0"><input type="text" class="form-control" id="searchInput" placeholder="🔍 Поиск..." onkeyup="filterProducts()"></div>
                <div class="col-md-4 mt-2 mt-md-0">
                    <select class="form-select" id="sortSelect" onchange="sortProducts()">
                        <option value="default">По умолчанию</option>
                        <option value="price_asc">Цена: по возрастанию</option>
                        <option value="price_desc">Цена: по убыванию</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="row g-4" id="productsContainer">
            <div class="col-12 text-center py-5"><div class="spinner-border text-primary"></div><p class="mt-3 text-muted">Загрузка...</p></div>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleCart()"></div>
    <div class="cart-modal" id="cartModal">
        <div class="cart-modal-header"><h5 class="mb-0"><i class="fas fa-shopping-cart"></i> Корзина</h5><button class="close-btn" onclick="toggleCart()">×</button></div>
        <div id="cartItems"><div class="text-center py-5 text-muted"><i class="fas fa-shopping-bag" style="font-size:48px; color:var(--text-muted);"></i><p class="mt-3">Корзина пуста</p></div></div>
    </div>

    <div id="toast" style="display:none;"></div>

    <div class="footer"><div class="container"><p>© 2024 Velosher Shop</p></div></div>

    <script>
        const products = [
            { id: 1, name: '🚲 Горный велосипед', price: 1500000, image: '', stock: 10 },
            { id: 2, name: '🚴 Шоссейный велосипед', price: 2000000, image: '', stock: 5 },
            { id: 3, name: '🚲 Детский велосипед', price: 800000, image: '', stock: 15 },
            { id: 4, name: '⚡ Электро велосипед', price: 3000000, image: '', stock: 3 }
        ];

        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        let cartOpen = false;

        function toggleTheme() {
            const root = document.documentElement;
            const currentBg = getComputedStyle(root).getPropertyValue('--bg').trim();
            const isDark = currentBg === '#0a0a1a';
            if (isDark) {
                root.style.setProperty('--bg', '#f0f2f5');
                root.style.setProperty('--card', '#ffffff');
                root.style.setProperty('--text', '#2d3436');
                root.style.setProperty('--text-muted', '#6c757d');
                root.style.setProperty('--border', '#e0e0e0');
                document.getElementById('themeIcon').className = 'fas fa-sun';
            } else {
                root.style.setProperty('--bg', '#0a0a1a');
                root.style.setProperty('--card', '#1a1a2e');
                root.style.setProperty('--text', '#ffffff');
                root.style.setProperty('--text-muted', '#a0a0b0');
                root.style.setProperty('--border', '#2a2a4e');
                document.getElementById('themeIcon').className = 'fas fa-moon';
            }
        }

        function toggleCart() {
            cartOpen = !cartOpen;
            document.getElementById('cartModal').classList.toggle('open', cartOpen);
            document.getElementById('overlay').classList.toggle('show', cartOpen);
            if (cartOpen) renderCart();
        }

        function renderProducts() {
            const container = document.getElementById('productsContainer');
            let html = '';
            products.forEach(p => {
                const inCart = cart.some(item => item.id === p.id);
                html += `
                    <div class="col-md-3 col-6">
                        <div class="product-card">
                            <img src="${p.image || 'https://via.placeholder.com/300x200/667eea/white?text=🚲'}" class="product-image" alt="${p.name}" onerror="this.src='https://via.placeholder.com/300x200/667eea/white?text=🚲'">
                            <div class="product-body">
                                <div class="product-name">${p.name}</div>
                                <div class="product-price">${p.price.toLocaleString()} сум</div>
                                <button class="btn-add ${inCart ? 'in-cart' : ''}" onclick="addToCart(${p.id})" ${p.stock > 0 ? '' : 'disabled'}>
                                    ${inCart ? '✅ В корзине' : '🛒 Добавить'}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            updateCartCount();
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;
            const existing = cart.find(item => item.id === id);
            if (existing) { showToast(`✅ ${product.name} уже в корзине`); return; }
            cart.push({ id: product.id, name: product.name, price: product.price, quantity: 1, image: product.image || '' });
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            showToast(`🛒 ${product.name} добавлен в корзину!`);
            renderProducts();
        }

        function renderCart() {
            const container = document.getElementById('cartItems');
            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center py-5 text-muted"><i class="fas fa-shopping-bag" style="font-size:48px; color:var(--text-muted);"></i><p class="mt-3">Корзина пуста</p></div>`;
                return;
            }
            let html = '', total = 0;
            cart.forEach(item => {
                const subtotal = item.price * item.quantity;
                total += subtotal;
                html += `
                    <div class="cart-item">
                        <img src="${item.image || 'https://via.placeholder.com/50/667eea/white?text=🚲'}" alt="${item.name}">
                        <div class="cart-item-info">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-price">${item.price.toLocaleString()} сум</div>
                        </div>
                        <div class="cart-item-qty">
                            <button onclick="updateQty(${item.id}, -1)">−</button>
                            <span>${item.quantity}</span>
                            <button onclick="updateQty(${item.id}, 1)">+</button>
                        </div>
                    </div>
                `;
            });
            html += `
                <div class="cart-total">
                    <div class="row align-items-center">
                        <div class="col-6"><strong>Итого:</strong><div class="total-price">${total.toLocaleString()} сум</div></div>
                        <div class="col-6 text-end"><button class="btn-checkout" onclick="checkout()"><i class="fas fa-check"></i> Оформить</button></div>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        function updateQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) cart = cart.filter(i => i.id !== id);
                localStorage.setItem('cart', JSON.stringify(cart));
                updateCartCount();
                renderCart();
            }
        }

        function checkout() {
            if (cart.length === 0) { showToast('❌ Корзина пуста'); return; }
            showToast('✅ Заказ оформлен! С вами свяжутся.');
            cart = [];
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            renderCart();
            toggleCart();
        }

        function updateCartCount() {
            const count = cart.reduce((s, i) => s + i.quantity, 0);
            document.getElementById('cartCount').textContent = count;
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(query));
            renderFiltered(filtered);
        }

        function renderFiltered(productsList) {
            const container = document.getElementById('productsContainer');
            let html = '';
            productsList.forEach(p => {
                const inCart = cart.some(item => item.id === p.id);
                html += `
                    <div class="col-md-3 col-6">
                        <div class="product-card">
                            <img src="${p.image || 'https://via.placeholder.com/300x200/667eea/white?text=🚲'}" class="product-image" alt="${p.name}" onerror="this.src='https://via.placeholder.com/300x200/667eea/white?text=🚲'">
                            <div class="product-body">
                                <div class="product-name">${p.name}</div>
                                <div class="product-price">${p.price.toLocaleString()} сум</div>
                                <button class="btn-add ${inCart ? 'in-cart' : ''}" onclick="addToCart(${p.id})" ${p.stock > 0 ? '' : 'disabled'}>
                                    ${inCart ? '✅ В корзине' : '🛒 Добавить'}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function sortProducts() {
            const sort = document.getElementById('sortSelect').value;
            let sorted = [...products];
            if (sort === 'price_asc') sorted.sort((a, b) => a.price - b.price);
            if (sort === 'price_desc') sorted.sort((a, b) => b.price - a.price);
            renderFiltered(sorted);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.display = 'block';
            toast.className = 'toast';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        renderProducts();
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape' && cartOpen) toggleCart(); });
    </script>
</body>
</html>
