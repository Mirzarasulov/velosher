<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a1a;
            --card: #1a1a2e;
            --text: #ffffff;
            --text-muted: #a0a0b0;
            --border: #2a2a4e;
            --primary: #667eea;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .sidebar {
            position: fixed; top: 0; left: 0; bottom: 0;
            width: 260px; background: var(--card); border-right: 1px solid var(--border);
            padding: 20px; z-index: 100; overflow-y: auto;
        }
        .sidebar .logo { font-size: 20px; font-weight: 700; color: var(--primary); padding-bottom: 20px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
        .sidebar .logo i { margin-right: 10px; }
        .sidebar .nav-item {
            display: block; padding: 12px 16px; border-radius: 10px;
            color: var(--text-muted); text-decoration: none;
            transition: all 0.3s; margin-bottom: 4px; font-size: 14px;
        }
        .sidebar .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
        .sidebar .nav-item.active { background: rgba(102,126,234,0.15); color: var(--primary); }
        .sidebar .nav-item i { margin-right: 12px; width: 20px; text-align: center; }
        .main-content { margin-left: 260px; padding: 20px; }
        .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; text-align: center; transition: all 0.3s; }
        .stat-card:hover { transform: translateY(-4px); border-color: var(--primary); }
        .stat-number { font-size: 2.5rem; font-weight: 700; color: var(--primary); }
        .stat-label { color: var(--text-muted); font-size: 0.9rem; }
        .glass { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
        .table-dark-custom { background: var(--bg); border-radius: 12px; overflow: hidden; }
        .table-dark-custom thead { background: rgba(102,126,234,0.15); }
        .table-dark-custom th { color: var(--text); padding: 12px 16px; border: none; font-size: 13px; }
        .table-dark-custom td { color: var(--text-muted); padding: 12px 16px; border-color: var(--border); }
        .badge-status { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-pending { background: rgba(255,193,7,0.2); color: #ffc107; }
        .badge-paid { background: rgba(40,167,69,0.2); color: #28a745; }
        .btn-glass { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 16px; border-radius: 10px; transition: all 0.3s; text-decoration: none; }
        .btn-glass:hover { background: var(--primary); color: white; border-color: var(--primary); }
        .text-muted-custom { color: var(--text-muted); }
        .theme-toggle { background: var(--border); border: none; color: var(--text); padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; transition: all 0.3s; }
        .theme-toggle:hover { background: var(--primary); }
        @media (max-width: 768px) {
            .sidebar { width: 100%; position: relative; padding: 15px; }
            .main-content { margin-left: 0; padding: 15px; }
            .stat-number { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo"><i class="fas fa-shield-alt"></i> Velosher Admin</div>
        <a href="dashboard.html" class="nav-item active"><i class="fas fa-chart-pie"></i> Главная</a>
        <a href="orders.html" class="nav-item"><i class="fas fa-box"></i> Заказы</a>
        <a href="products.html" class="nav-item"><i class="fas fa-tag"></i> Товары</a>
        <a href="users.html" class="nav-item"><i class="fas fa-users"></i> Пользователи</a>
        <a href="chat.html" class="nav-item"><i class="fas fa-comment-dots"></i> Чат</a>
        <a href="broadcast.html" class="nav-item"><i class="fas fa-bullhorn"></i> Рассылка</a>
        <a href="../shop.html" class="nav-item" style="margin-top:20px; border-top:1px solid var(--border); padding-top:20px;"><i class="fas fa-store"></i> Магазин</a>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0" style="color:var(--text);"><i class="fas fa-chart-pie" style="color:var(--primary);"></i> Панель управления</h2>
            <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon" id="themeIcon"></i></button>
        </div>

        <div class="row g-4 mb-4" id="statsContainer">
            <div class="col-md-3 col-6"><div class="stat-card"><div class="stat-number" id="statUsers">0</div><div class="stat-label">👥 Пользователи</div></div></div>
            <div class="col-md-3 col-6"><div class="stat-card"><div class="stat-number" id="statOrders">0</div><div class="stat-label">📦 Заказы</div></div></div>
            <div class="col-md-3 col-6"><div class="stat-card"><div class="stat-number" id="statPending">0</div><div class="stat-label">⏳ Ожидают</div></div></div>
            <div class="col-md-3 col-6"><div class="stat-card"><div class="stat-number" id="statRevenue">0</div><div class="stat-label">💰 Выручка</div></div></div>
        </div>

        <div class="glass">
            <h5 style="color:var(--text);"><i class="fas fa-clock" style="color:var(--primary);"></i> Последние заказы</h5>
            <div id="ordersList"><div class="text-center py-4 text-muted-custom">Загрузка...</div></div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const root = document.documentElement;
            const currentBg = getComputedStyle(root).getPropertyValue('--bg').trim();
            const isDark = currentBg === '#0a0a1a';
            if (isDark) {
                root.style.setProperty('--bg', '#f0f2f5');
                root.style.setProperty('--card', '#ffffff');
                root.style.setProperty('--text', '#2d3436');
                root.style.setProperty('--text-muted', '#6c757d');
                root.style.setProperty('--border', '#e0e0e0');
                document.getElementById('themeIcon').className = 'fas fa-sun';
            } else {
                root.style.setProperty('--bg', '#0a0a1a');
                root.style.setProperty('--card', '#1a1a2e');
                root.style.setProperty('--text', '#ffffff');
                root.style.setProperty('--text-muted', '#a0a0b0');
                root.style.setProperty('--border', '#2a2a4e');
                document.getElementById('themeIcon').className = 'fas fa-moon';
            }
        }

        // Заглушка статистики
        document.getElementById('statUsers').textContent = 5;
        document.getElementById('statOrders').textContent = 12;
        document.getElementById('statPending').textContent = 3;
        document.getElementById('statRevenue').textContent = '12 500 000';

        const ordersHtml = `
            <div class="table-responsive"><table class="table-dark-custom table">
                <thead><tr><th>Заказ</th><th>Покупатель</th><th>Сумма</th><th>Статус</th></tr></thead>
                <tbody>
                    <tr><td><strong style="color:var(--primary);">#001</strong></td><td>Иван</td><td>1 500 000 сум</td><td><span class="badge-status badge-paid">✅ Оплачен</span></td></tr>
                    <tr><td><strong style="color:var(--primary);">#002</strong></td><td>Петр</td><td>2 000 000 сум</td><td><span class="badge-status badge-pending">⏳ Ожидает</span></td></tr>
                    <tr><td><strong style="color:var(--primary);">#003</strong></td><td>Анна</td><td>800 000 сум</td><td><span class="badge-status badge-paid">✅ Оплачен</span></td></tr>
                </tbody>
            </table></div>
        `;
        document.getElementById('ordersList').innerHTML = ordersHtml;
    </script>
</body>
</html>
