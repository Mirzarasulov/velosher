<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель Velosher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a1a; color: #fff; min-height: 100vh; }
        
        /* Сайдбар */
        .sidebar { 
            position: fixed; 
            top: 0; left: 0; bottom: 0; 
            width: 280px; 
            background: rgba(255,255,255,0.03); 
            backdrop-filter: blur(20px); 
            border-right: 1px solid rgba(255,255,255,0.06); 
            padding: 30px 20px; 
            z-index: 100; 
        }
        .sidebar .logo { 
            font-size: 24px; 
            font-weight: 800; 
            color: #667eea; 
            padding-bottom: 30px; 
            border-bottom: 1px solid rgba(255,255,255,0.06); 
            margin-bottom: 30px; 
        }
        .sidebar .logo i { margin-right: 12px; }
        .sidebar .nav-item { 
            display: block; 
            padding: 14px 18px; 
            border-radius: 12px; 
            color: rgba(255,255,255,0.7); 
            text-decoration: none; 
            transition: all 0.3s; 
            margin-bottom: 4px; 
            font-weight: 500; 
            font-size: 15px;
        }
        .sidebar .nav-item:hover { 
            background: rgba(255,255,255,0.05); 
            color: #fff; 
        }
        .sidebar .nav-item.active { 
            background: rgba(102,126,234,0.15); 
            color: #667eea; 
        }
        .sidebar .nav-item i { 
            margin-right: 14px; 
            width: 20px; 
            text-align: center; 
        }
        .sidebar .nav-item .badge { 
            float: right; 
            background: #ff4757; 
            color: #fff; 
            font-size: 11px; 
            padding: 2px 10px; 
            border-radius: 20px; 
        }
        
        /* Основной контент */
        .main-content { 
            margin-left: 280px; 
            padding: 30px; 
        }
        
        /* Стеклянные карточки */
        .glass { 
            background: rgba(255,255,255,0.03); 
            border: 1px solid rgba(255,255,255,0.06); 
            border-radius: 16px; 
            padding: 24px; 
        }
        
        /* Статистика */
        .stat-card { 
            background: rgba(255,255,255,0.03); 
            border: 1px solid rgba(255,255,255,0.06); 
            border-radius: 16px; 
            padding: 24px; 
            text-align: center; 
            transition: all 0.3s; 
        }
        .stat-card:hover { 
            background: rgba(255,255,255,0.05); 
            transform: translateY(-4px); 
        }
        .stat-number { 
            font-size: 2.8rem; 
            font-weight: 700; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        .stat-label { 
            color: rgba(255,255,255,0.6); 
            font-size: 0.9rem; 
            font-weight: 500; 
            margin-top: 6px; 
        }
        .stat-icon { 
            font-size: 2rem; 
            margin-bottom: 8px; 
        }
        
        /* Таблицы */
        .table-dark-custom { 
            background: rgba(255,255,255,0.02); 
            border-radius: 12px; 
            overflow: hidden; 
        }
        .table-dark-custom thead { 
            background: rgba(102,126,234,0.15); 
        }
        .table-dark-custom th { 
            color: #fff; 
            padding: 14px 16px; 
            border: none; 
            font-weight: 600; 
            font-size: 13px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
        }
        .table-dark-custom td { 
            color: rgba(255,255,255,0.85); 
            padding: 14px 16px; 
            border-color: rgba(255,255,255,0.04); 
        }
        .table-dark-custom tr:hover { 
            background: rgba(255,255,255,0.03); 
        }
        
        .badge-status { 
            padding: 4px 14px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: 600; 
        }
        .badge-pending { 
            background: rgba(255,193,7,0.2); 
            color: #ffc107; 
        }
        .badge-paid { 
            background: rgba(40,167,69,0.2); 
            color: #28a745; 
        }
        
        .text-muted-custom { 
            color: rgba(255,255,255,0.4); 
        }
        
        @media (max-width: 768px) { 
            .sidebar { 
                width: 100%; 
                position: relative; 
                padding: 15px; 
            } 
            .main-content { 
                margin-left: 0; 
                padding: 15px; 
            } 
            .stat-number { 
                font-size: 2rem; 
            } 
        }
    </style>
</head>
<body>

    <!-- САЙДБАР -->
    <div class="sidebar">
        <div class="logo"><i class="fas fa-shield-alt"></i> Velosher Admin</div>
        
        <a href="/admin/" class="nav-item active">
            <i class="fas fa-chart-pie"></i> Главная
        </a>
        <a href="/admin/orders/" class="nav-item">
            <i class="fas fa-box"></i> Заказы
            <span class="badge" id="pendingBadge">0</span>
        </a>
        <a href="/admin/products/" class="nav-item">
            <i class="fas fa-tag"></i> Товары
        </a>
        <a href="/admin/users/" class="nav-item">
            <i class="fas fa-users"></i> Пользователи
            <span class="badge" id="usersBadge">0</span>
        </a>
        <a href="/admin/chat/" class="nav-item">
            <i class="fas fa-comment-dots"></i> Чат
            <span class="badge" id="chatBadge">0</span>
        </a>
        <a href="/admin/broadcast/" class="nav-item">
            <i class="fas fa-bullhorn"></i> Рассылка
        </a>
        
        <a href="/shop/" class="nav-item" style="margin-top:20px; border-top:1px solid rgba(255,255,255,0.06); padding-top:20px;">
            <i class="fas fa-store"></i> Магазин
        </a>
        <a href="https://t.me/velosher_shop_bot" class="nav-item">
            <i class="fab fa-telegram"></i> Бот
        </a>
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0 fw-bold">
                <i class="fas fa-chart-pie" style="color:#667eea;"></i> 
                <span style="color:#fff;">Панель управления</span>
            </h2>
            <span style="color:rgba(255,255,255,0.4); font-size:14px;">
                <i class="fas fa-clock"></i> <span id="currentTime"></span>
            </span>
        </div>

        <!-- СТАТИСТИКА -->
        <div class="row g-4 mb-4" id="statsContainer">
            <div class="col-md-3 col-6">
                <div class="stat-card">
                    <div class="stat-icon">👥</div>
                    <div class="stat-number" id="statUsers">0</div>
                    <div class="stat-label">Пользователи</div>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="stat-card">
                    <div class="stat-icon">📦</div>
                    <div class="stat-number" id="statOrders">0</div>
                    <div class="stat-label">Всего заказов</div>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="stat-card">
                    <div class="stat-icon">⏳</div>
                    <div class="stat-number" id="statPending">0</div>
                    <div class="stat-label">Ожидают</div>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="stat-card">
                    <div class="stat-icon">💰</div>
                    <div class="stat-number" id="statRevenue">0</div>
                    <div class="stat-label">Выручка (сум)</div>
                </div>
            </div>
        </div>

        <!-- ПОСЛЕДНИЕ ЗАКАЗЫ -->
        <div class="glass">
            <h5 class="mb-3" style="color:#fff;">
                <i class="fas fa-clock" style="color:#667eea;"></i> 
                Последние заказы
            </h5>
            <div id="ordersList">
                <div class="text-center py-4 text-muted-custom">Загрузка...</div>
            </div>
        </div>
    </div>

    <script>
        // ========== ВРЕМЯ ==========
        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleString('ru-RU', {
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        }
        updateTime();
        setInterval(updateTime, 60000);

        // ========== СТАТИСТИКА ==========
        async function loadStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                document.getElementById('statUsers').textContent = data.users || 0;
                document.getElementById('statOrders').textContent = data.orders || 0;
                document.getElementById('statPending').textContent = data.pending_orders || 0;
                document.getElementById('statRevenue').textContent = (data.revenue || 0).toLocaleString();
                
                document.getElementById('usersBadge').textContent = data.users || 0;
                document.getElementById('pendingBadge').textContent = data.pending_orders || 0;
            } catch(e) { console.error(e); }
        }

        // ========== ЗАКАЗЫ ==========
        async function loadOrders() {
            try {
                const res = await fetch('/api/orders');
                const data = await res.json();
                let html = `<div class="table-responsive"><table class="table-dark-custom table">
                    <thead><tr><th>Заказ</th><th>Покупатель</th><th>Сумма</th><th>Статус</th><th>Дата</th></tr></thead><tbody>`;
                if (data.orders && data.orders.length > 0) {
                    data.orders.slice(0, 10).forEach(o => {
                        const statusClass = o.status === 'paid' ? 'badge-paid' : 'badge-pending';
                        html += `<tr>
                            <td><strong style="color:#667eea;">#${o.order_id}</strong></td>
                            <td>${o.user_name || 'Гость'}</td>
                            <td><strong>${(o.total_amount || 0).toLocaleString()} сум</strong></td>
                            <td><span class="badge-status ${statusClass}">${o.status || 'pending'}</span></td>
                            <td style="color:rgba(255,255,255,0.4); font-size:13px;">${o.created_at ? o.created_at.slice(0,16) : '-'}</td>
                        </tr>`;
                    });
                } else {
                    html += `<tr><td colspan="5" class="text-center text-muted-custom">Нет заказов</td></tr>`;
                }
                html += '</tbody></table></div>';
                document.getElementById('ordersList').innerHTML = html;
            } catch(e) { console.error(e); }
        }

        // ========== ЧАТ ==========
        async function loadChatBadge() {
            try {
                const res = await fetch('/api/messages?limit=1');
                const data = await res.json();
                const unread = data.messages ? data.messages.filter(m => m.is_read === 0 && m.is_admin === 0).length : 0;
                document.getElementById('chatBadge').textContent = unread || 0;
            } catch(e) { console.error(e); }
        }

        // ========== ЗАГРУЗКА ==========
        document.addEventListener('DOMContentLoaded', function() {
            loadStats();
            loadOrders();
            loadChatBadge();
            setInterval(loadStats, 30000);
            setInterval(loadOrders, 30000);
            setInterval(loadChatBadge, 30000);
        });
    </script>
</body>
</html>
