<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 Velosher Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a1a;
            --card: #1a1a2e;
            --text: #ffffff;
            --text-muted: #a0a0b0;
            --border: #2a2a4e;
            --primary: #667eea;
            --success: #00b894;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .sidebar {
            position: fixed; top: 0; left: 0; bottom: 0;
            width: 250px; background: var(--card);
            border-right: 1px solid var(--border);
            padding: 20px; z-index: 100; overflow-y: auto;
        }
        .sidebar .logo {
            font-size: 22px; font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .sidebar .nav-item {
            display: block; padding: 12px 16px; border-radius: 10px;
            color: var(--text-muted); text-decoration: none;
            transition: all 0.3s; margin-bottom: 4px; font-size: 14px;
        }
        .sidebar .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
        .sidebar .nav-item.active { background: rgba(102,126,234,0.15); color: var(--primary); }
        .sidebar .nav-item i { margin-right: 12px; width: 20px; text-align: center; }
        .main-content { margin-left: 250px; padding: 20px; }
        .glass {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--bg);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid var(--border);
        }
        .stat-card .num {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
        }
        .stat-card .label {
            color: var(--text-muted);
            font-size: 13px;
        }
        .stat-card i {
            font-size: 24px;
            color: var(--primary);
            margin-bottom: 8px;
            display: block;
        }
        .table-dark-custom {
            background: var(--bg);
            border-radius: 12px;
            overflow: hidden;
            width: 100%;
        }
        .table-dark-custom thead { background: rgba(102,126,234,0.15); }
        .table-dark-custom th { color: var(--text); padding: 12px 16px; border: none; font-size: 13px; }
        .table-dark-custom td { color: var(--text-muted); padding: 12px 16px; border-color: var(--border); }
        .badge-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-pending { background: rgba(245,158,11,0.2); color: #f59e0b; }
        .badge-paid { background: rgba(0,184,148,0.2); color: var(--success); }
        .badge-cancelled { background: rgba(255,71,87,0.2); color: #ff4757; }
        @media (max-width: 768px) {
            .sidebar { width: 100%; position: relative; padding: 15px; }
            .main-content { margin-left: 0; padding: 15px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo"><i class="fas fa-shield-alt"></i> Velosher Admin</div>
        <a href="dashboard.html" class="nav-item active"><i class="fas fa-chart-pie"></i> Главная</a>
        <a href="products.html" class="nav-item"><i class="fas fa-tag"></i> Товары</a>
        <a href="orders.html" class="nav-item"><i class="fas fa-box"></i> Заказы</a>
        <a href="users.html" class="nav-item"><i class="fas fa-users"></i> Пользователи</a>
        <a href="chat.html" class="nav-item"><i class="fas fa-comment-dots"></i> Чат</a>
        <a href="broadcast.html" class="nav-item"><i class="fas fa-bullhorn"></i> Рассылка</a>
        <a href="/shop/" class="nav-item" style="margin-top:20px; border-top:1px solid var(--border); padding-top:20px;">
            <i class="fas fa-store"></i> Магазин
        </a>
    </div>

    <div class="main-content">
        <h2 class="mb-4"><i class="fas fa-chart-pie" style="color:var(--primary);"></i> Панель управления</h2>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <i class="fas fa-box"></i>
                <div class="num" id="totalProducts">0</div>
                <div class="label">Товаров</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-shopping-cart"></i>
                <div class="num" id="totalOrders">0</div>
                <div class="label">Заказов</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-users"></i>
                <div class="num" id="totalUsers">0</div>
                <div class="label">Пользователей</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-coins"></i>
                <div class="num" id="totalRevenue">0</div>
                <div class="label">Выручка (сум)</div>
            </div>
        </div>

        <div class="glass">
            <h5><i class="fas fa-box" style="color:var(--primary);"></i> Последние заказы</h5>
            <div class="table-responsive">
                <table class="table-dark-custom table">
                    <thead>
                        <tr>
                            <th>№</th>
                            <th>Покупатель</th>
                            <th>Сумма</th>
                            <th>Статус</th>
                            <th>Дата</th>
                        </tr>
                    </thead>
                    <tbody id="recentOrders">
                        <tr><td colspan="5" style="text-align:center;">Нет заказов</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:5000';

        async function loadStats() {
            try {
                const res = await fetch(`${API_URL}/api/admin/stats`);
                const data = await res.json();
                document.getElementById('totalProducts').textContent = data.total_products || 0;
                document.getElementById('totalOrders').textContent = data.total_orders || 0;
                document.getElementById('totalUsers').textContent = data.total_users || 0;
                document.getElementById('totalRevenue').textContent = (data.total_revenue || 0).toLocaleString();
            } catch (e) {
                console.error('Stats error:', e);
            }
        }

        async function loadRecentOrders() {
            try {
                const res = await fetch(`${API_URL}/api/admin/orders`);
                const data = await res.json();
                const tbody = document.getElementById('recentOrders');
                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Нет заказов</td></tr>';
                    return;
                }
                const statusMap = {
                    'pending': '<span class="badge-status badge-pending">⏳ Ожидает</span>',
                    'paid': '<span class="badge-status badge-paid">✅ Оплачен</span>',
                    'cancelled': '<span class="badge-status badge-cancelled">❌ Отменен</span>'
                };
                tbody.innerHTML = data.slice(0, 5).map(o => `
                    <tr>
                        <td>#${o.id}</td>
                        <td>${o.username || o.first_name || 'Аноним'}</td>
                        <td>${formatPrice(o.total_price)} сум</td>
                        <td>${statusMap[o.status] || o.status}</td>
                        <td>${o.created_at ? new Date(o.created_at).toLocaleDateString() : '—'}</td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error('Orders error:', e);
            }
        }

        function formatPrice(p) { return new Intl.NumberFormat('uz-UZ').format(p); }

        document.addEventListener('DOMContentLoaded', function() {
            loadStats();
            loadRecentOrders();
        });
    </script>
</body>
</html>
