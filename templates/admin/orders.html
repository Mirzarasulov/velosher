<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📦 Заказы - Velosher Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a1a;
            --card: #1a1a2e;
            --text: #ffffff;
            --text-muted: #a0a0b0;
            --border: #2a2a4e;
            --primary: #667eea;
            --success: #00b894;
            --danger: #ff4757;
            --warning: #f59e0b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .sidebar {
            position: fixed; top: 0; left: 0; bottom: 0;
            width: 250px; background: var(--card);
            border-right: 1px solid var(--border);
            padding: 20px; z-index: 100; overflow-y: auto;
        }
        .sidebar .logo {
            font-size: 22px; font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .sidebar .nav-item {
            display: block; padding: 12px 16px; border-radius: 10px;
            color: var(--text-muted); text-decoration: none;
            transition: all 0.3s; margin-bottom: 4px; font-size: 14px;
        }
        .sidebar .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
        .sidebar .nav-item.active { background: rgba(102,126,234,0.15); color: var(--primary); }
        .sidebar .nav-item i { margin-right: 12px; width: 20px; text-align: center; }
        .main-content { margin-left: 250px; padding: 20px; }
        
        .glass {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .btn-glass {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-glass:hover { background: var(--primary); color: white; border-color: var(--primary); }
        .btn-success { background: var(--success); border: none; color: white; padding: 6px 14px; border-radius: 6px; cursor: pointer; }
        .btn-success:hover { opacity: 0.8; }
        .btn-danger { background: var(--danger); border: none; color: white; padding: 6px 14px; border-radius: 6px; cursor: pointer; }
        .btn-danger:hover { opacity: 0.8; }
        
        .table-dark-custom {
            background: var(--bg);
            border-radius: 12px;
            overflow: hidden;
            width: 100%;
        }
        .table-dark-custom thead { background: rgba(102,126,234,0.15); }
        .table-dark-custom th { color: var(--text); padding: 12px 16px; border: none; font-size: 13px; }
        .table-dark-custom td { color: var(--text-muted); padding: 12px 16px; border-color: var(--border); }
        
        .badge-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-new { background: rgba(245,158,11,0.2); color: var(--warning); }
        .badge-paid { background: rgba(0,184,148,0.2); color: var(--success); }
        .badge-completed { background: rgba(102,126,234,0.2); color: var(--primary); }
        .badge-cancelled { background: rgba(255,71,87,0.2); color: var(--danger); }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 14px 28px;
            border-radius: 12px;
            z-index: 9999;
            display: none;
            animation: slideUp 0.4s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .toast.show { display: block; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(30px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @media (max-width: 768px) {
            .sidebar { width: 100%; position: relative; padding: 15px; }
            .main-content { margin-left: 0; padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo"><i class="fas fa-shield-alt"></i> Velosher Admin</div>
        <a href="dashboard.html" class="nav-item"><i class="fas fa-chart-pie"></i> Главная</a>
        <a href="products.html" class="nav-item"><i class="fas fa-tag"></i> Товары</a>
        <a href="orders.html" class="nav-item active"><i class="fas fa-box"></i> Заказы</a>
        <a href="users.html" class="nav-item"><i class="fas fa-users"></i> Пользователи</a>
        <a href="chat.html" class="nav-item"><i class="fas fa-comment-dots"></i> Чат</a>
        <a href="broadcast.html" class="nav-item"><i class="fas fa-bullhorn"></i> Рассылка</a>
        <a href="/templates/shop" class="nav-item" style="margin-top:20px; border-top:1px solid var(--border); padding-top:20px;">
            <i class="fas fa-store"></i> Магазин
        </a>
    </div>

    <div class="main-content">
        <h2 class="mb-4"><i class="fas fa-box" style="color:var(--primary);"></i> Все заказы</h2>

        <div class="glass">
            <div class="table-responsive">
                <table class="table-dark-custom table">
                    <thead>
                        <tr>
                            <th>№</th>
                            <th>Покупатель</th>
                            <th>Телефон</th>
                            <th>Сумма</th>
                            <th>Статус</th>
                            <th>Дата</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="ordersList">
                        <tr><td colspan="7" style="text-align:center;">Загрузка...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_URL = 'http://127.0.0.1:5000';

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => t.classList.remove('show'), 3000);
        }

        function formatPrice(p) { return new Intl.NumberFormat('uz-UZ').format(p); }

        const statusMap = {
            'new': '<span class="badge-status badge-new">🟡 Новый</span>',
            'paid': '<span class="badge-status badge-paid">🟢 Оплачен</span>',
            'completed': '<span class="badge-status badge-completed">✅ Завершен</span>',
            'cancelled': '<span class="badge-status badge-cancelled">❌ Отменен</span>'
        };

        async function loadOrders() {
            try {
                const res = await fetch(`${API_URL}/api/admin/orders`);
                const data = await res.json();
                const tbody = document.getElementById('ordersList');
                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Нет заказов</td></tr>';
                    return;
                }
                tbody.innerHTML = data.map(o => `
                    <tr>
                        <td>#${o.id}</td>
                        <td>${o.username || o.first_name || 'Аноним'}</td>
                        <td>${o.phone || '—'}</td>
                        <td>${formatPrice(o.total_price)} сум</td>
                        <td>${statusMap[o.status] || o.status}</td>
                        <td>${o.created_at}</td>
                        <td>
                            <button class="btn-success" onclick="updateStatus(${o.id}, 'paid')"><i class="fas fa-check"></i></button>
                            <button class="btn-danger" onclick="updateStatus(${o.id}, 'cancelled')"><i class="fas fa-times"></i></button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error('Load orders error:', e);
                document.getElementById('ordersList').innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--danger);">❌ Ошибка загрузки</td></tr>';
            }
        }

        async function updateStatus(id, status) {
            if (!confirm(`Изменить статус заказа #${id} на "${status}"?`)) return;
            try {
                const res = await fetch(`${API_URL}/api/admin/orders/${id}/`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('✅ Статус обновлен!');
                    loadOrders();
                }
            } catch (e) {
                showToast('❌ Ошибка обновления');
            }
        }

        document.addEventListener('DOMContentLoaded', loadOrders);
    </script>
</body>
</html>
