<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📢 Рассылка - Velosher Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a1a;
            --card: #1a1a2e;
            --text: #ffffff;
            --text-muted: #a0a0b0;
            --border: #2a2a4e;
            --primary: #667eea;
            --success: #00b894;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .sidebar {
            position: fixed; top: 0; left: 0; bottom: 0;
            width: 250px; background: var(--card);
            border-right: 1px solid var(--border);
            padding: 20px; z-index: 100; overflow-y: auto;
        }
        .sidebar .logo {
            font-size: 22px; font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .sidebar .nav-item {
            display: block; padding: 12px 16px; border-radius: 10px;
            color: var(--text-muted); text-decoration: none;
            transition: all 0.3s; margin-bottom: 4px; font-size: 14px;
        }
        .sidebar .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
        .sidebar .nav-item.active { background: rgba(102,126,234,0.15); color: var(--primary); }
        .sidebar .nav-item i { margin-right: 12px; width: 20px; text-align: center; }
        .main-content { margin-left: 250px; padding: 20px; }
        .glass {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .btn-primary { background: var(--primary); border: none; color: white; padding: 10px 20px; border-radius: 10px; cursor: pointer; }
        .btn-primary:hover { background: #5a67d8; }
        .btn-success { background: var(--success); border: none; color: white; padding: 10px 20px; border-radius: 10px; cursor: pointer; }
        .btn-success:hover { background: #00a381; }
        .form-control {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
        }
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102,126,234,0.2);
            background: var(--bg);
            color: var(--text);
        }
        .broadcast-item {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }
        .broadcast-item .b-date { color: var(--text-muted); font-size: 12px; }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 14px 28px;
            border-radius: 12px;
            z-index: 9999;
            display: none;
            animation: slideUp 0.4s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .toast.show { display: block; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(30px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @media (max-width: 768px) {
            .sidebar { width: 100%; position: relative; padding: 15px; }
            .main-content { margin-left: 0; padding: 15px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo"><i class="fas fa-shield-alt"></i> Velosher Admin</div>
        <a href="dashboard.html" class="nav-item"><i class="fas fa-chart-pie"></i> Главная</a>
        <a href="products.html" class="nav-item"><i class="fas fa-tag"></i> Товары</a>
        <a href="orders.html" class="nav-item"><i class="fas fa-box"></i> Заказы</a>
        <a href="users.html" class="nav-item"><i class="fas fa-users"></i> Пользователи</a>
        <a href="chat.html" class="nav-item"><i class="fas fa-comment-dots"></i> Чат</a>
        <a href="broadcast.html" class="nav-item active"><i class="fas fa-bullhorn"></i> Рассылка</a>
        <a href="/shop/" class="nav-item" style="margin-top:20px; border-top:1px solid var(--border); padding-top:20px;">
            <i class="fas fa-store"></i> Магазин
        </a>
    </div>

    <div class="main-content">
        <h2 class="mb-4"><i class="fas fa-bullhorn" style="color:var(--primary);"></i> Рассылка сообщений</h2>

        <div class="glass">
            <h5><i class="fas fa-plus-circle" style="color:var(--primary);"></i> Создать рассылку</h5>
            <div class="mb-3">
                <textarea class="form-control" id="broadcastMessage" rows="4" placeholder="Введите сообщение для рассылки..."></textarea>
            </div>
            <button class="btn-success w-100" onclick="sendBroadcast()"><i class="fas fa-paper-plane"></i> Отправить всем пользователям</button>
        </div>

        <div class="glass">
            <h5><i class="fas fa-history" style="color:var(--primary);"></i> История рассылок</h5>
            <div id="broadcastHistory">
                <div style="text-align:center;color:var(--text-muted);padding:20px;">Нет рассылок</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_URL = 'http://127.0.0.1:5000';

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => t.classList.remove('show'), 3000);
        }

        function getBroadcasts() {
            try {
                const data = JSON.parse(localStorage.getItem('velosher_broadcasts') || '[]');
                const container = document.getElementById('broadcastHistory');
                if (!data || data.length === 0) {
                    container.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:20px;">Нет рассылок</div>';
                    return;
                }
                container.innerHTML = data.map(b => `
                    <div class="broadcast-item">
                        <div>${b.message}</div>
                        <div class="b-date">📅 ${new Date(b.date).toLocaleString()}</div>
                    </div>
                `).join('');
            } catch (e) {
                console.error('Load broadcasts error:', e);
            }
        }

        async function sendBroadcast() {
            const message = document.getElementById('broadcastMessage').value.trim();
            if (!message) {
                showToast('❌ Введите сообщение');
                return;
            }

            try {
                // Сохраняем в локальное хранилище
                const broadcasts = JSON.parse(localStorage.getItem('velosher_broadcasts') || '[]');
                broadcasts.unshift({ message, date: new Date().toISOString() });
                localStorage.setItem('velosher_broadcasts', JSON.stringify(broadcasts));

                // Отправляем через API
                await fetch(`${API_URL}/api/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: '📢 РАССЫЛКА:\n\n' + message,
                        is_admin: 1,
                        username: 'Администратор',
                        first_name: 'Admin'
                    })
                });

                document.getElementById('broadcastMessage').value = '';
                showToast('✅ Рассылка отправлена!');
                getBroadcasts();
            } catch (e) {
                showToast('❌ Ошибка отправки');
            }
        }

        document.addEventListener('DOMContentLoaded', getBroadcasts);
    </script>
</body>
</html>
