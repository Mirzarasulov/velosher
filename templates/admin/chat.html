<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат - Админ-панель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a1a; color: #fff; min-height: 100vh; }
        .sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 280px; background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); border-right: 1px solid rgba(255,255,255,0.06); padding: 30px 20px; z-index: 100; }
        .sidebar .logo { font-size: 24px; font-weight: 800; color: #667eea; padding-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.06); margin-bottom: 30px; }
        .sidebar .nav-item { display: block; padding: 14px 18px; border-radius: 12px; color: rgba(255,255,255,0.7); text-decoration: none; transition: all 0.3s; margin-bottom: 4px; font-weight: 500; font-size: 15px; }
        .sidebar .nav-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .sidebar .nav-item.active { background: rgba(102,126,234,0.15); color: #667eea; }
        .sidebar .nav-item i { margin-right: 14px; width: 20px; text-align: center; }
        .main-content { margin-left: 280px; padding: 30px; }
        .glass { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 24px; }
        .message-item { background: rgba(255,255,255,0.03); border-radius: 12px; padding: 16px; margin-bottom: 12px; border-left: 3px solid #667eea; transition: all 0.3s; }
        .message-item:hover { background: rgba(255,255,255,0.06); }
        .message-item .user { font-weight: 600; color: #667eea; }
        .message-item .time { font-size: 12px; color: rgba(255,255,255,0.3); float: right; }
        .message-item .text { margin-top: 6px; color: rgba(255,255,255,0.85); }
        .message-item .badge-new { background: #ff4757; color: #fff; font-size: 10px; padding: 2px 10px; border-radius: 20px; margin-left: 10px; }
        .message-item.is-admin { border-left-color: #00b894; }
        .message-item.is-admin .user { color: #00b894; }
        .reply-input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); color: #fff; border-radius: 12px; padding: 12px 16px; width: 100%; }
        .reply-input:focus { background: rgba(255,255,255,0.08); border-color: #667eea; outline: none; }
        .reply-input::placeholder { color: rgba(255,255,255,0.3); }
        .btn-send { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 600; transition: all 0.3s; }
        .btn-send:hover { transform: scale(1.03); box-shadow: 0 8px 25px rgba(102,126,234,0.3); color: #fff; }
        .text-muted-custom { color: rgba(255,255,255,0.4); }
        @media (max-width: 768px) { .sidebar { width: 100%; position: relative; padding: 15px; } .main-content { margin-left: 0; padding: 15px; } }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo"><i class="fas fa-shield-alt"></i> Velosher Admin</div>
        <a href="/admin/" class="nav-item"><i class="fas fa-chart-pie"></i> Главная</a>
        <a href="/admin/orders/" class="nav-item"><i class="fas fa-box"></i> Заказы</a>
        <a href="/admin/products/" class="nav-item"><i class="fas fa-tag"></i> Товары</a>
        <a href="/admin/users/" class="nav-item"><i class="fas fa-users"></i> Пользователи</a>
        <a href="/admin/chat/" class="nav-item active"><i class="fas fa-comment-dots"></i> Чат</a>
        <a href="/admin/broadcast/" class="nav-item"><i class="fas fa-bullhorn"></i> Рассылка</a>
        <a href="/shop/" class="nav-item" style="margin-top:20px; border-top:1px solid rgba(255,255,255,0.06); padding-top:20px;"><i class="fas fa-store"></i> Магазин</a>
    </div>

    <div class="main-content">
        <h2 class="mb-4 fw-bold" style="color:#fff;">
            <i class="fas fa-comment-dots" style="color:#667eea;"></i> Чат с пользователями
        </h2>
        
        <div class="glass mb-4">
            <div id="messagesContainer">
                <div class="text-center py-4 text-muted-custom">Загрузка...</div>
            </div>
        </div>

        <div class="glass">
            <div class="row">
                <div class="col-md-8">
                    <input type="text" class="reply-input" id="replyInput" placeholder="✏️ Напишите сообщение пользователю...">
                </div>
                <div class="col-md-4 mt-2 mt-md-0">
                    <input type="text" class="reply-input" id="userIdInput" placeholder="🆔 ID пользователя">
                </div>
                <div class="col-12 mt-2">
                    <button class="btn-send w-100" onclick="sendMessage()">
                        <i class="fas fa-paper-plane"></i> Отправить
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadMessages() {
            try {
                const res = await fetch('/api/messages?limit=100');
                const data = await res.json();
                let html = '';
                if (data.messages && data.messages.length > 0) {
                    data.messages.reverse().forEach(m => {
                        const isAdmin = m.is_admin === 1;
                        const userName = isAdmin ? '👑 Администратор' : (m.first_name || m.username || 'Пользователь');
                        const badge = m.is_read === 0 && !isAdmin ? '<span class="badge-new">Новое</span>' : '';
                        const adminClass = isAdmin ? 'is-admin' : '';
                        html += `
                            <div class="message-item ${adminClass}">
                                <div>
                                    <span class="user">${userName}</span>${badge}
                                    <span class="time">${m.created_at ? m.created_at.slice(0,16) : ''}</span>
                                </div>
                                <div class="text">${m.message}</div>
                                <div style="font-size:11px; color:rgba(255,255,255,0.2); margin-top:5px;">
                                    ID: ${m.telegram_id}
                                </div>
                            </div>
                        `;
                    });
                } else {
                    html = `<div class="text-center py-5 text-muted-custom">
                        <i class="fas fa-comment-slash" style="font-size:32px;"></i>
                        <p class="mt-3">Нет сообщений</p>
                    </div>`;
                }
                document.getElementById('messagesContainer').innerHTML = html;
                await fetch('/api/messages/read/all', { method: 'POST' });
            } catch(e) {
                document.getElementById('messagesContainer').innerHTML = `
                    <div class="text-center text-danger py-5">
                        <i class="fas fa-exclamation-triangle" style="font-size:32px;"></i>
                        <p class="mt-3">Ошибка загрузки</p>
                    </div>
                `;
            }
        }

        async function sendMessage() {
            const message = document.getElementById('replyInput').value.trim();
            const telegramId = document.getElementById('userIdInput').value.trim();
            if (!message || !telegramId) {
                alert('Введите сообщение и ID пользователя');
                return;
            }
            try {
                const res = await fetch('/api/messages/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telegram_id: telegramId,
                        username: 'admin',
                        first_name: 'Администратор',
                        message: message,
                        is_admin: 1
                    })
                });
                if (res.ok) {
                    alert('✅ Сообщение отправлено!');
                    document.getElementById('replyInput').value = '';
                    loadMessages();
                } else {
                    alert('❌ Ошибка отправки');
                }
            } catch(e) {
                alert('❌ Ошибка отправки');
            }
        }

        document.getElementById('replyInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
        document.getElementById('userIdInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        document.addEventListener('DOMContentLoaded', loadMessages);
        setInterval(loadMessages, 30000);
    </script>
</body>
</html>
