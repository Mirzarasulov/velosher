<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💬 Чат - Velosher Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a1a;
            --card: #1a1a2e;
            --text: #ffffff;
            --text-muted: #a0a0b0;
            --border: #2a2a4e;
            --primary: #667eea;
            --success: #00b894;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .sidebar {
            position: fixed; top: 0; left: 0; bottom: 0;
            width: 250px; background: var(--card);
            border-right: 1px solid var(--border);
            padding: 20px; z-index: 100; overflow-y: auto;
        }
        .sidebar .logo {
            font-size: 22px; font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .sidebar .nav-item {
            display: block; padding: 12px 16px; border-radius: 10px;
            color: var(--text-muted); text-decoration: none;
            transition: all 0.3s; margin-bottom: 4px; font-size: 14px;
        }
        .sidebar .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
        .sidebar .nav-item.active { background: rgba(102,126,234,0.15); color: var(--primary); }
        .sidebar .nav-item i { margin-right: 12px; width: 20px; text-align: center; }
        .main-content { margin-left: 250px; padding: 20px; }
        .glass {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .btn-primary { background: var(--primary); border: none; color: white; padding: 10px 20px; border-radius: 10px; cursor: pointer; }
        .btn-primary:hover { background: #5a67d8; }
        .form-control {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
        }
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102,126,234,0.2);
            background: var(--bg);
            color: var(--text);
        }
        .message-item {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }
        .message-item .msg-user { font-weight: 600; color: var(--primary); }
        .message-item .msg-date { color: var(--text-muted); font-size: 12px; margin-left: 10px; }
        .message-item .msg-text { color: var(--text); margin-top: 4px; }
        .message-item.admin-msg { background: rgba(102,126,234,0.08); }
        .message-item.admin-msg .msg-user { color: var(--success); }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 14px 28px;
            border-radius: 12px;
            z-index: 9999;
            display: none;
            animation: slideUp 0.4s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .toast.show { display: block; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(30px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @media (max-width: 768px) {
            .sidebar { width: 100%; position: relative; padding: 15px; }
            .main-content { margin-left: 0; padding: 15px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo"><i class="fas fa-shield-alt"></i> Velosher Admin</div>
        <a href="dashboard.html" class="nav-item"><i class="fas fa-chart-pie"></i> Главная</a>
        <a href="products.html" class="nav-item"><i class="fas fa-tag"></i> Товары</a>
        <a href="orders.html" class="nav-item"><i class="fas fa-box"></i> Заказы</a>
        <a href="users.html" class="nav-item"><i class="fas fa-users"></i> Пользователи</a>
        <a href="chat.html" class="nav-item active"><i class="fas fa-comment-dots"></i> Чат</a>
        <a href="broadcast.html" class="nav-item"><i class="fas fa-bullhorn"></i> Рассылка</a>
        <a href="/shop/" class="nav-item" style="margin-top:20px; border-top:1px solid var(--border); padding-top:20px;">
            <i class="fas fa-store"></i> Магазин
        </a>
    </div>

    <div class="main-content">
        <h2 class="mb-4"><i class="fas fa-comment-dots" style="color:var(--primary);"></i> Чат с пользователями</h2>

        <div class="glass">
            <div class="row g-2 mb-3">
                <div class="col-md-10">
                    <input type="text" class="form-control" id="chatMessage" placeholder="Введите сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
                </div>
                <div class="col-md-2">
                    <button class="btn-primary w-100" onclick="sendMessage()"><i class="fas fa-paper-plane"></i> Отправить</button>
                </div>
            </div>
            <div id="messagesContainer">
                <div style="text-align:center;color:var(--text-muted);padding:20px;">Загрузка сообщений...</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_URL = 'http://127.0.0.1:5000';

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => t.classList.remove('show'), 3000);
        }

        async function loadMessages() {
            try {
                const res = await fetch(`${API_URL}/api/messages`);
                const data = await res.json();
                const container = document.getElementById('messagesContainer');
                if (!data.messages || data.messages.length === 0) {
                    container.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:20px;">Нет сообщений</div>';
                    return;
                }
                container.innerHTML = data.messages.map(m => `
                    <div class="message-item ${m.is_admin ? 'admin-msg' : ''}">
                        <span class="msg-user">${m.is_admin ? '👑 Админ' : (m.username || m.first_name || 'Пользователь')}</span>
                        <span class="msg-date">${new Date(m.created_at).toLocaleString()}</span>
                        <div class="msg-text">${m.message}</div>
                    </div>
                `).join('');
            } catch (e) {
                console.error('Load messages error:', e);
                document.getElementById('messagesContainer').innerHTML = '<div style="text-align:center;color:var(--danger);padding:20px;">❌ Ошибка загрузки</div>';
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chatMessage');
            const text = input.value.trim();
            if (!text) return;

            try {
                await fetch(`${API_URL}/api/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, is_admin: 1, username: 'Администратор', first_name: 'Admin' })
                });
                input.value = '';
                showToast('✅ Сообщение отправлено!');
                loadMessages();
            } catch (e) {
                showToast('❌ Ошибка отправки');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadMessages();
            setInterval(loadMessages, 10000);
        });
    </script>
</body>
</html>
