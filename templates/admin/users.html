<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пользователи - Админ-панель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0a1a; color: #fff; min-height: 100vh; }
        .sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 250px; background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); border-right: 1px solid rgba(255,255,255,0.06); padding: 30px 20px; z-index: 100; }
        .sidebar .logo { font-size: 22px; font-weight: 800; color: #667eea; padding-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.06); margin-bottom: 30px; }
        .sidebar .logo i { margin-right: 10px; }
        .sidebar .nav-item { display: block; padding: 12px 16px; border-radius: 12px; color: rgba(255,255,255,0.6); text-decoration: none; transition: all 0.3s; margin-bottom: 4px; font-weight: 500; }
        .sidebar .nav-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .sidebar .nav-item.active { background: rgba(102,126,234,0.15); color: #667eea; }
        .sidebar .nav-item i { margin-right: 12px; width: 20px; text-align: center; }
        .main-content { margin-left: 260px; padding: 30px; }
        .glass { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 24px; }
        .table-dark-custom { background: rgba(255,255,255,0.02); border-radius: 12px; overflow: hidden; }
        .table-dark-custom thead { background: rgba(102,126,234,0.15); }
        .table-dark-custom th { color: #fff; padding: 14px 16px; border: none; font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
        .table-dark-custom td { color: rgba(255,255,255,0.85); padding: 14px 16px; border-color: rgba(255,255,255,0.04); }
        .admin-badge { background: #ff4757; color: #fff; padding: 2px 12px; border-radius: 20px; font-size: 11px; margin-left: 8px; }
        .status-active { color: #00b894; }
        .btn-glass { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.7); padding: 6px 14px; border-radius: 8px; transition: all 0.3s; font-size: 13px; cursor: pointer; }
        .btn-glass:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-glass i { margin-right: 5px; }
        @media (max-width: 768px) { .sidebar { width: 100%; position: relative; padding: 15px; } .main-content { margin-left: 0; padding: 15px; } }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo"><i class="fas fa-shield-alt"></i> Velosher Admin</div>
        <a href="/admin/" class="nav-item"><i class="fas fa-chart-pie"></i> Главная</a>
        <a href="/admin/orders/" class="nav-item"><i class="fas fa-box"></i> Заказы</a>
        <a href="/admin/products/" class="nav-item"><i class="fas fa-tag"></i> Товары</a>
        <a href="/admin/users/" class="nav-item active"><i class="fas fa-users"></i> Пользователи</a>
        <a href="/admin/chat/" class="nav-item"><i class="fas fa-comment-dots"></i> Чат</a>
        <a href="/admin/broadcast/" class="nav-item"><i class="fas fa-bullhorn"></i> Рассылка</a>
        <a href="/shop/" class="nav-item" style="margin-top:20px; border-top:1px solid rgba(255,255,255,0.06); padding-top:20px;"><i class="fas fa-store"></i> Магазин</a>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0 fw-bold"><i class="fas fa-users" style="color:#667eea;"></i> Все пользователи</h2>
            <div>
                <button class="btn-glass" onclick="exportUsers()"><i class="fas fa-download"></i> Экспорт</button>
                <button class="btn-glass" onclick="location.reload()"><i class="fas fa-sync"></i> Обновить</button>
            </div>
        </div>

        <div class="glass">
            <div id="usersList">
                <div class="text-center py-4 text-muted">Загрузка...</div>
            </div>
        </div>
    </div>

    <script>
        async function loadUsers() {
            try {
                const res = await fetch('/api/users');
                const data = await res.json();
                let html = `<div class="table-responsive"><table class="table-dark-custom table">
                    <thead><tr><th>ID</th><th>Имя</th><th>Телефон</th><th>Адрес</th><th>Заказов</th><th>Статус</th><th>Дата</th></tr></thead><tbody>`;
                if (data.users && data.users.length > 0) {
                    data.users.forEach(u => {
                        const isAdmin = u.telegram_id === '6040186314';
                        html += `<tr>
                            <td><code style="color:#667eea;">${u.telegram_id}</code></td>
                            <td>${u.first_name || 'Не указано'} ${u.username ? '@'+u.username : ''} ${isAdmin ? '<span class="admin-badge">👑 Админ</span>' : ''}</td>
                            <td style="color:rgba(255,255,255,0.6);">${u.phone || '-'}</td>
                            <td style="color:rgba(255,255,255,0.6);">${u.address || '-'}</td>
                            <td>${u.total_orders || 0}</td>
                            <td><span class="status-active">🟢 Активен</span></td>
                            <td style="color:rgba(255,255,255,0.4); font-size:13px;">${u.created_at ? u.created_at.slice(0,16) : '-'}</td>
                        </tr>`;
                    });
                } else {
                    html += `<tr><td colspan="7" class="text-center text-muted">Нет пользователей</td></tr>`;
                }
                html += '</tbody></table></div>';
                document.getElementById('usersList').innerHTML = html;
            } catch(e) {
                document.getElementById('usersList').innerHTML = '<div class="text-center py-4 text-danger">Ошибка загрузки</div>';
            }
        }

        async function exportUsers() {
            try {
                const res = await fetch('/api/users');
                const data = await res.json();
                if (!data.users || data.users.length === 0) {
                    alert('Нет пользователей для экспорта');
                    return;
                }
                let csv = 'ID,Имя,Телефон,Адрес,Заказов,Дата\n';
                data.users.forEach(u => {
                    csv += `${u.telegram_id},"${u.first_name || ''} ${u.username ? '@'+u.username : ''}","${u.phone || ''}","${u.address || ''}",${u.total_orders || 0},"${u.created_at || ''}"\n`;
                });
                const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `users_${new Date().toISOString().slice(0,10)}.csv`;
                link.click();
                URL.revokeObjectURL(link.href);
            } catch(e) {
                alert('Ошибка экспорта');
            }
        }

        document.addEventListener('DOMContentLoaded', loadUsers);
        setInterval(loadUsers, 30000);
    </script>
</body>
</html>
