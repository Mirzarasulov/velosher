<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👥 Пользователи - Velosher Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a1a;
            --card: #1a1a2e;
            --text: #ffffff;
            --text-muted: #a0a0b0;
            --border: #2a2a4e;
            --primary: #667eea;
            --success: #00b894;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .sidebar {
            position: fixed; top: 0; left: 0; bottom: 0;
            width: 250px; background: var(--card);
            border-right: 1px solid var(--border);
            padding: 20px; z-index: 100; overflow-y: auto;
        }
        .sidebar .logo {
            font-size: 22px; font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .sidebar .nav-item {
            display: block; padding: 12px 16px; border-radius: 10px;
            color: var(--text-muted); text-decoration: none;
            transition: all 0.3s; margin-bottom: 4px; font-size: 14px;
        }
        .sidebar .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
        .sidebar .nav-item.active { background: rgba(102,126,234,0.15); color: var(--primary); }
        .sidebar .nav-item i { margin-right: 12px; width: 20px; text-align: center; }
        .main-content { margin-left: 250px; padding: 20px; }
        .glass {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .table-dark-custom {
            background: var(--bg);
            border-radius: 12px;
            overflow: hidden;
            width: 100%;
        }
        .table-dark-custom thead { background: rgba(102,126,234,0.15); }
        .table-dark-custom th { color: var(--text); padding: 12px 16px; border: none; font-size: 13px; }
        .table-dark-custom td { color: var(--text-muted); padding: 12px 16px; border-color: var(--border); }
        .admin-badge {
            background: #ff4757;
            color: white;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            margin-left: 8px;
        }
        .status-active { color: var(--success); }
        @media (max-width: 768px) {
            .sidebar { width: 100%; position: relative; padding: 15px; }
            .main-content { margin-left: 0; padding: 15px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo"><i class="fas fa-shield-alt"></i> Velosher Admin</div>
        <a href="dashboard.html" class="nav-item"><i class="fas fa-chart-pie"></i> Главная</a>
        <a href="products.html" class="nav-item"><i class="fas fa-tag"></i> Товары</a>
        <a href="orders.html" class="nav-item"><i class="fas fa-box"></i> Заказы</a>
        <a href="users.html" class="nav-item active"><i class="fas fa-users"></i> Пользователи</a>
        <a href="chat.html" class="nav-item"><i class="fas fa-comment-dots"></i> Чат</a>
        <a href="broadcast.html" class="nav-item"><i class="fas fa-bullhorn"></i> Рассылка</a>
        <a href="/shop/" class="nav-item" style="margin-top:20px; border-top:1px solid var(--border); padding-top:20px;">
            <i class="fas fa-store"></i> Магазин
        </a>
    </div>

    <div class="main-content">
        <h2 class="mb-4"><i class="fas fa-users" style="color:var(--primary);"></i> Все пользователи</h2>

        <div class="glass">
            <div class="table-responsive">
                <table class="table-dark-custom table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Имя</th>
                            <th>Телефон</th>
                            <th>Заказов</th>
                            <th>Статус</th>
                        </tr>
                    </thead>
                    <tbody id="usersList">
                        <tr><td colspan="5" style="text-align:center;">Загрузка...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:5000';

        async function loadUsers() {
            try {
                const res = await fetch(`${API_URL}/api/users`);
                const data = await res.json();
                const tbody = document.getElementById('usersList');
                if (!data.users || data.users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Нет пользователей</td></tr>';
                    return;
                }
                tbody.innerHTML = data.users.map(u => `
                    <tr>
                        <td><code style="color:var(--primary);">${u.telegram_id || u.id}</code></td>
                        <td>${u.first_name || 'Аноним'} ${u.is_admin ? '<span class="admin-badge">👑 Админ</span>' : ''}</td>
                        <td>${u.phone || '—'}</td>
                        <td>${u.total_orders || 0}</td>
                        <td><span class="status-active">🟢 Активен</span></td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error('Load users error:', e);
                document.getElementById('usersList').innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--danger);">❌ Ошибка загрузки</td></tr>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadUsers);
    </script>
</body>
</html>
