<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товары - Админ-панель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a1a; color: #fff; min-height: 100vh; }
        .sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 280px; background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); border-right: 1px solid rgba(255,255,255,0.06); padding: 30px 20px; z-index: 100; }
        .sidebar .logo { font-size: 24px; font-weight: 800; color: #667eea; padding-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.06); margin-bottom: 30px; }
        .sidebar .nav-item { display: block; padding: 14px 18px; border-radius: 12px; color: rgba(255,255,255,0.7); text-decoration: none; transition: all 0.3s; margin-bottom: 4px; font-weight: 500; font-size: 15px; }
        .sidebar .nav-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .sidebar .nav-item.active { background: rgba(102,126,234,0.15); color: #667eea; }
        .sidebar .nav-item i { margin-right: 14px; width: 20px; text-align: center; }
        .main-content { margin-left: 280px; padding: 30px; }
        .glass { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 24px; }
        .form-control { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); color: #fff; border-radius: 12px; padding: 12px 16px; }
        .form-control:focus { background: rgba(255,255,255,0.08); border-color: #667eea; color: #fff; box-shadow: none; }
        .form-control::placeholder { color: rgba(255,255,255,0.3); }
        .form-control[type="file"] { padding: 10px; color: rgba(255,255,255,0.6); }
        .form-control[type="file"]::file-selector-button { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; padding: 8px 16px; border-radius: 8px; color: #fff; font-weight: 500; cursor: pointer; }
        .btn-gradient { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 600; transition: all 0.3s; }
        .btn-gradient:hover { transform: scale(1.03); box-shadow: 0 8px 25px rgba(102,126,234,0.3); color: #fff; }
        .btn-danger-glass { background: rgba(220,53,69,0.15); border: 1px solid rgba(220,53,69,0.2); color: #dc3545; padding: 6px 14px; border-radius: 8px; transition: all 0.3s; font-size: 13px; cursor: pointer; }
        .btn-danger-glass:hover { background: rgba(220,53,69,0.25); color: #ff6b7a; }
        .table-dark-custom { background: rgba(255,255,255,0.02); border-radius: 12px; overflow: hidden; }
        .table-dark-custom thead { background: rgba(102,126,234,0.15); }
        .table-dark-custom th { color: #fff; padding: 14px 16px; border: none; font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
        .table-dark-custom td { color: rgba(255,255,255,0.85); padding: 14px 16px; border-color: rgba(255,255,255,0.04); }
        .product-img { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; }
        .text-muted-custom { color: rgba(255,255,255,0.4); }
        @media (max-width: 768px) { .sidebar { width: 100%; position: relative; padding: 15px; } .main-content { margin-left: 0; padding: 15px; } }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo"><i class="fas fa-shield-alt"></i> Velosher Admin</div>
        <a href="/admin/" class="nav-item"><i class="fas fa-chart-pie"></i> Главная</a>
        <a href="/admin/orders/" class="nav-item"><i class="fas fa-box"></i> Заказы</a>
        <a href="/admin/products/" class="nav-item active"><i class="fas fa-tag"></i> Товары</a>
        <a href="/admin/users/" class="nav-item"><i class="fas fa-users"></i> Пользователи</a>
        <a href="/admin/chat/" class="nav-item"><i class="fas fa-comment-dots"></i> Чат</a>
        <a href="/admin/broadcast/" class="nav-item"><i class="fas fa-bullhorn"></i> Рассылка</a>
        <a href="/shop/" class="nav-item" style="margin-top:20px; border-top:1px solid rgba(255,255,255,0.06); padding-top:20px;"><i class="fas fa-store"></i> Магазин</a>
    </div>

    <div class="main-content">
        <h2 class="mb-4 fw-bold" style="color:#fff;">
            <i class="fas fa-tag" style="color:#667eea;"></i> Управление товарами
        </h2>
        
        <div class="glass mb-4">
            <h5 class="mb-3" style="color:#fff;">
                <i class="fas fa-plus-circle" style="color:#667eea;"></i> Добавить товар
            </h5>
            <form id="addProductForm" enctype="multipart/form-data" class="row g-3">
                <div class="col-md-4">
                    <input type="text" class="form-control" id="pName" placeholder="Название (RU)" required>
                </div>
                <div class="col-md-4">
                    <input type="text" class="form-control" id="pNameUz" placeholder="Nomi (UZ)">
                </div>
                <div class="col-md-4">
                    <input type="number" class="form-control" id="pPrice" placeholder="Цена" required step="0.01">
                </div>
                <div class="col-md-3">
                    <input type="number" class="form-control" id="pStock" placeholder="Кол-во" value="10">
                </div>
                <div class="col-md-9">
                    <textarea class="form-control" id="pDesc" placeholder="Описание (RU)" rows="2"></textarea>
                </div>
                <div class="col-md-6">
                    <textarea class="form-control" id="pDescUz" placeholder="Tavsif (UZ)" rows="2"></textarea>
                </div>
                <div class="col-md-6">
                    <input type="file" class="form-control" id="pImage" accept="image/*">
                </div>
                <div class="col-12">
                    <button type="submit" class="btn-gradient w-100"><i class="fas fa-plus"></i> Добавить товар</button>
                </div>
            </form>
        </div>

        <div class="glass">
            <h5 class="mb-3" style="color:#fff;">
                <i class="fas fa-list" style="color:#667eea;"></i> Список товаров
            </h5>
            <div id="productsList">
                <div class="text-center py-4 text-muted-custom">Загрузка...</div>
            </div>
        </div>
    </div>

    <script>
        async function loadProducts() {
            try {
                const res = await fetch('/api/products');
                const data = await res.json();
                let html = `<div class="table-responsive"><table class="table-dark-custom table">
                    <thead><tr><th>Фото</th><th>Название</th><th>Цена</th><th>Кол-во</th><th>Действие</th></tr></thead><tbody>`;
                if (data.products && data.products.length > 0) {
                    data.products.forEach(p => {
                        const imgHtml = p.image ? `<img src="${p.image}" class="product-img" alt="${p.name}">` : '📷';
                        html += `<tr>
                            <td>${imgHtml}</td>
                            <td>${p.name || 'Без названия'}</td>
                            <td>${p.price.toLocaleString()} сум</td>
                            <td>${p.stock || 0}</td>
                            <td><button class="btn-danger-glass" onclick="deleteProduct(${p.id})"><i class="fas fa-trash"></i></button></td>
                        </tr>`;
                    });
                } else {
                    html += `<tr><td colspan="5" class="text-center text-muted-custom">Нет товаров</td></tr>`;
                }
                html += '</tbody></table></div>';
                document.getElementById('productsList').innerHTML = html;
            } catch(e) { console.error(e); }
        }

        document.getElementById('addProductForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData();
            formData.append('name', document.getElementById('pName').value);
            formData.append('name_uz', document.getElementById('pNameUz').value || document.getElementById('pName').value);
            formData.append('description', document.getElementById('pDesc').value);
            formData.append('description_uz', document.getElementById('pDescUz').value || '');
            formData.append('price', document.getElementById('pPrice').value);
            formData.append('stock', document.getElementById('pStock').value);
            const image = document.getElementById('pImage').files[0];
            if (image) formData.append('image', image);
            
            try {
                const res = await fetch('/api/products/add', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.success) {
                    alert('✅ Товар добавлен!');
                    this.reset();
                    loadProducts();
                } else {
                    alert('❌ Ошибка: ' + (data.error || 'Неизвестная ошибка'));
                }
            } catch(e) { alert('❌ Ошибка добавления'); }
        });

        async function deleteProduct(id) {
            if (!confirm('Удалить товар?')) return;
            try {
                const res = await fetch(`/api/products/${id}/delete`, { method: 'DELETE' });
                if (res.ok) {
                    alert('✅ Товар удален');
                    loadProducts();
                }
            } catch(e) { alert('❌ Ошибка'); }
        }

        document.addEventListener('DOMContentLoaded', loadProducts);
        setInterval(loadProducts, 30000);
    </script>
</body>
</html>
