<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📦 Товары - Velosher Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a1a;
            --card: #1a1a2e;
            --text: #ffffff;
            --text-muted: #a0a0b0;
            --border: #2a2a4e;
            --primary: #667eea;
            --success: #00b894;
            --danger: #ff4757;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .sidebar {
            position: fixed; top: 0; left: 0; bottom: 0;
            width: 250px; background: var(--card);
            border-right: 1px solid var(--border);
            padding: 20px; z-index: 100; overflow-y: auto;
        }
        .sidebar .logo {
            font-size: 22px; font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .sidebar .nav-item {
            display: block; padding: 12px 16px; border-radius: 10px;
            color: var(--text-muted); text-decoration: none;
            transition: all 0.3s; margin-bottom: 4px; font-size: 14px;
        }
        .sidebar .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
        .sidebar .nav-item.active { background: rgba(102,126,234,0.15); color: var(--primary); }
        .sidebar .nav-item i { margin-right: 12px; width: 20px; text-align: center; }
        .main-content { margin-left: 250px; padding: 20px; }
        .glass {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .form-control, .form-select {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102,126,234,0.2);
            background: var(--bg);
            color: var(--text);
        }
        .btn-success { background: var(--success); border: none; color: white; padding: 10px 20px; border-radius: 10px; cursor: pointer; }
        .btn-success:hover { background: #00a381; }
        .btn-success:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-danger { background: var(--danger); border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .btn-danger:hover { background: #e63946; }
        .table-dark-custom {
            background: var(--bg);
            border-radius: 12px;
            overflow: hidden;
            width: 100%;
        }
        .table-dark-custom thead { background: rgba(102,126,234,0.15); }
        .table-dark-custom th { color: var(--text); padding: 12px 16px; border: none; font-size: 13px; }
        .table-dark-custom td { color: var(--text-muted); padding: 12px 16px; border-color: var(--border); vertical-align: middle; }
        .badge-category {
            background: rgba(102,126,234,0.2);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        .prod-thumb {
            width: 46px; height: 46px; border-radius: 8px; object-fit: cover;
            background: rgba(255,255,255,0.05); border: 1px solid var(--border);
        }
        .upload-box {
            border: 2px dashed var(--border); border-radius: 12px; padding: 14px;
            text-align: center; cursor: pointer; transition: all 0.3s; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .upload-box:hover { border-color: var(--primary); background: rgba(102,126,234,0.05); }
        .upload-box img { max-height: 60px; max-width: 100%; border-radius: 6px; margin-bottom: 6px; }
        .upload-box i { font-size: 22px; color: var(--text-muted); margin-bottom: 6px; }
        .upload-box span { font-size: 11px; color: var(--text-muted); }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 14px 28px;
            border-radius: 12px;
            z-index: 9999;
            display: none;
            animation: slideUp 0.4s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .toast.show { display: block; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(30px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @media (max-width: 768px) {
            .sidebar { width: 100%; position: relative; padding: 15px; }
            .main-content { margin-left: 0; padding: 15px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo"><i class="fas fa-shield-alt"></i> Velosher Admin</div>
        <a href="dashboard.html" class="nav-item"><i class="fas fa-chart-pie"></i> Главная</a>
        <a href="products.html" class="nav-item active"><i class="fas fa-tag"></i> Товары</a>
        <a href="orders.html" class="nav-item"><i class="fas fa-box"></i> Заказы</a>
        <a href="users.html" class="nav-item"><i class="fas fa-users"></i> Пользователи</a>
        <a href="chat.html" class="nav-item"><i class="fas fa-comment-dots"></i> Чат</a>
        <a href="broadcast.html" class="nav-item"><i class="fas fa-bullhorn"></i> Рассылка</a>
        <a href="/shop/" class="nav-item" style="margin-top:20px; border-top:1px solid var(--border); padding-top:20px;">
            <i class="fas fa-store"></i> Магазин
        </a>
    </div>

    <div class="main-content">
        <h2 class="mb-4"><i class="fas fa-tag" style="color:var(--primary);"></i> Управление товарами</h2>

        <div class="glass">
            <h5><i class="fas fa-plus-circle" style="color:var(--primary);"></i> Добавить товар</h5>
            <div class="row g-2">
                <div class="col-md-3">
                    <input type="text" class="form-control" id="productName" placeholder="Название товара">
                </div>
                <div class="col-md-2">
                    <input type="number" class="form-control" id="productPrice" placeholder="Цена (SUM)">
                </div>
                <div class="col-md-2">
                    <input type="number" class="form-control" id="productStock" placeholder="Кол-во">
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="productCategory">
                        <option value="">Без категории</option>
                        <option value="1">🏔️ Горные</option>
                        <option value="2">🏙️ Городские</option>
                        <option value="3">🚴 Шоссейные</option>
                        <option value="4">⚡ Электро</option>
                        <option value="5">👶 Детские</option>
                        <option value="6">📦 Складные</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button class="btn-success w-100" id="addBtn" onclick="addProduct()"><i class="fas fa-plus"></i> Добавить</button>
                </div>
            </div>
            <div class="row g-2 mt-1">
                <div class="col-md-9">
                    <textarea class="form-control h-100" id="productDescription" placeholder="Описание товара" rows="3"></textarea>
                </div>
                <div class="col-md-3">
                    <div class="upload-box" id="uploadBox" onclick="document.getElementById('productImageInput').click()">
                        <img id="imgPreview" style="display:none;">
                        <i class="fas fa-camera" id="uploadIcon"></i>
                        <span id="uploadLabel">Добавить фото</span>
                    </div>
                    <input type="file" id="productImageInput" accept="image/*" style="display:none" onchange="handleImageSelect(event)">
                </div>
            </div>
        </div>

        <div class="glass">
            <h5><i class="fas fa-list" style="color:var(--primary);"></i> Все товары</h5>
            <div class="table-responsive">
                <table class="table-dark-custom table">
                    <thead>
                        <tr>
                            <th>Фото</th>
                            <th>Название</th>
                            <th>Категория</th>
                            <th>Цена</th>
                            <th>Кол-во</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="productsList">
                        <tr><td colspan="6" style="text-align:center;">Загрузка...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ============ FIREBASE (Realtime Database, доступ по обычным REST-запросам) ============
        // Важно: в консоли Firebase → Realtime Database → Rules должно быть разрешено
        // чтение/запись (см. пояснение, которое я дал в чате).
        const FIREBASE_URL = 'https://velosher-f82b5-default-rtdb.asia-southeast1.firebasedatabase.app';

        let selectedImageDataUrl = '';

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => t.classList.remove('show'), 3000);
        }

        function formatPrice(p) { return new Intl.NumberFormat('uz-UZ').format(p); }

        // Сжимаем фото в браузере перед сохранением в базу (иначе база разрастётся)
        function compressImage(file, maxWidth = 900, quality = 0.72) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let w = img.width, h = img.height;
                        if (w > maxWidth) { h = Math.round(h * (maxWidth / w)); w = maxWidth; }
                        const canvas = document.createElement('canvas');
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = () => reject(new Error('Не удалось прочитать изображение'));
                    img.src = e.target.result;
                };
                reader.onerror = () => reject(new Error('Не удалось прочитать файл'));
                reader.readAsDataURL(file);
            });
        }

        async function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            try {
                selectedImageDataUrl = await compressImage(file);
                document.getElementById('imgPreview').src = selectedImageDataUrl;
                document.getElementById('imgPreview').style.display = 'block';
                document.getElementById('uploadIcon').style.display = 'none';
                document.getElementById('uploadLabel').textContent = 'Фото выбрано ✓';
            } catch (e) {
                showToast('❌ Ошибка загрузки фото: ' + e.message);
            }
        }

        function resetImagePicker() {
            selectedImageDataUrl = '';
            document.getElementById('productImageInput').value = '';
            document.getElementById('imgPreview').style.display = 'none';
            document.getElementById('uploadIcon').style.display = 'block';
            document.getElementById('uploadLabel').textContent = 'Добавить фото';
        }

        async function loadProducts() {
            const tbody = document.getElementById('productsList');
            try {
                const res = await fetch(`${FIREBASE_URL}/products.json`);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                if (!data) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Нет товаров</td></tr>';
                    return;
                }
                const products = Object.entries(data).map(([key, p]) => ({ ...p, id: p.id || key }));
                const categoryMap = {
                    1: '🏔️ Горные', 2: '🏙️ Городские', 3: '🚴 Шоссейные',
                    4: '⚡ Электро', 5: '👶 Детские', 6: '📦 Складные'
                };
                tbody.innerHTML = products.map(p => `
                    <tr>
                        <td>${p.image ? `<img src="${p.image}" class="prod-thumb">` : `<div class="prod-thumb d-flex align-items-center justify-content-center"><i class="fas fa-image" style="color:var(--text-muted);"></i></div>`}</td>
                        <td>${p.name}</td>
                        <td><span class="badge-category">${categoryMap[p.category_id] || 'Без категории'}</span></td>
                        <td>${formatPrice(p.price)} сум</td>
                        <td>${p.stock}</td>
                        <td>
                            <button class="btn-danger" onclick="deleteProduct('${p.id}')"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error('Load products error:', e);
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--danger);">❌ Ошибка загрузки. Проверьте правила доступа в Firebase (Realtime Database → Rules).</td></tr>';
            }
        }

        async function addProduct() {
            const name = document.getElementById('productName').value.trim();
            const price = parseFloat(document.getElementById('productPrice').value);
            const stock = parseInt(document.getElementById('productStock').value) || 0;
            const category_id = document.getElementById('productCategory').value;
            const description = document.getElementById('productDescription').value.trim();

            if (!name || !price) {
                showToast('❌ Введите название и цену');
                return;
            }

            const addBtn = document.getElementById('addBtn');
            addBtn.disabled = true;
            addBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Добавление...';

            try {
                // Firebase сам создаёт уникальный ключ (push id)
                const res = await fetch(`${FIREBASE_URL}/products.json`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name, price, stock,
                        category_id: category_id ? Number(category_id) : null,
                        description,
                        image: selectedImageDataUrl || '',
                        created_at: new Date().toISOString()
                    })
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const result = await res.json(); // { name: "<push_id>" }
                const newId = result.name;

                // Сохраняем сам id внутрь записи, чтобы он совпадал с ключом
                await fetch(`${FIREBASE_URL}/products/${newId}/id.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newId)
                });

                document.getElementById('productName').value = '';
                document.getElementById('productPrice').value = '';
                document.getElementById('productStock').value = '';
                document.getElementById('productDescription').value = '';
                document.getElementById('productCategory').value = '';
                resetImagePicker();
                showToast('✅ Товар добавлен!');
                loadProducts();
            } catch (e) {
                showToast('❌ Ошибка: ' + e.message);
            } finally {
                addBtn.disabled = false;
                addBtn.innerHTML = '<i class="fas fa-plus"></i> Добавить';
            }
        }

        async function deleteProduct(id) {
            if (!confirm('Удалить товар?')) return;
            try {
                const res = await fetch(`${FIREBASE_URL}/products/${id}.json`, { method: 'DELETE' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                showToast('✅ Товар удален');
                loadProducts();
            } catch (e) {
                showToast('❌ Ошибка удаления: ' + e.message);
            }
        }

        document.addEventListener('DOMContentLoaded', loadProducts);
    </script>
</body>
</html>
